  <circle cx="22" cy="21" r="5" fill="#9ECE6A"/>
  <text x="37" y="26" fill="#9ECE6A" font-family="monospace" font-size="13">NETWORK READY</text>
  <text x="20" y="44" fill="#A9B1D6" font-family="monospace" font-size="11">10.0.0.0/24</text>
