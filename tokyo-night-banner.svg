<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
<title id="title">CyberLab Tokyo Night banner</title>
<desc id="desc">Dark navy cyber lab banner with blue and purple network traces.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#161B33"/>
    <stop offset="0.55" stop-color="#101525"/>
    <stop offset="1" stop-color="#242044"/>
  </linearGradient>
  <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#7AA2F7"/>
    <stop offset="1" stop-color="#BB9AF7"/>
  </linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#414868" stroke-width="1" opacity=".42"/>
  </pattern>
  <filter id="glow">
    <feGaussianBlur stdDeviation="4" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<rect width="1200" height="340" rx="22" fill="url(#bg)"/>
<rect width="1200" height="340" rx="22" fill="url(#grid)"/>
<g fill="none" stroke="url(#line)" stroke-width="2" opacity=".9">
  <path d="M760 0V62H850V110H980V72H1200"/>
  <path d="M830 340V280H920V230H1030V260H1200"/>
  <path d="M1010 0V34H1080V110H1140V150H1200"/>
  <path d="M730 220H790V190H860V150H930"/>
  <path d="M880 62h-30m0 0v-20m0 20v20"/>
</g>
<g fill="#7AA2F7" filter="url(#glow)">
  <circle cx="850" cy="62" r="5"/><circle cx="980" cy="110" r="5"/><circle cx="920" cy="280" r="5"/><circle cx="1030" cy="230" r="5"/>
</g>
<g transform="translate(76 75)">
  <rect width="58" height="58" rx="14" fill="#7AA2F7"/>
  <path d="M29 10L45 17V29C45 40 38 47 29 51C20 47 13 40 13 29V17Z" fill="none" stroke="#101525" stroke-width="3"/>
  <path d="M21 29l6 6 12-13" fill="none" stroke="#101525" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<text x="76" y="183" fill="#C0CAF5" font-family="monospace, sans-serif" font-size="47" font-weight="700" letter-spacing="2">CYBERLAB</text>
<text x="79" y="220" fill="#BB9AF7" font-family="monospace, sans-serif" font-size="20" letter-spacing="3">WEEK_01 // LAB INITIALIZATION</text>
<text x="79" y="267" fill="#A9B1D6" font-family="monospace, sans-serif" font-size="17">ARCH LINUX  ·  VIRTUALBOX  ·  KALI LINUX</text>
<text x="79" y="302" fill="#7DCFFF" font-family="monospace, sans-serif" font-size="14">$ lab_status --network CyberLab</text>
<g transform="translate(940 140)">
